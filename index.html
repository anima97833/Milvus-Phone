<!doctype html>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script>
      if (!window.mammoth) {
        document.write('<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"><\/script>');
      }
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">

              "on-secondary-fixed": "#304247",
              "surface-container-highest": "#eae8e0",
              "primary-fixed-dim": "#ced8c3",
              "on-error-container": "#6e1400",
              "on-surface-variant": "#65655e",
              "outline-variant": "#bbb9b2",
              primary: "#5e6756",
              error: "#ae4025",
              "secondary-container": "#d2e6ec",
              "on-tertiary-fixed-variant": "#6b4747",

              surface: "#fffcf7",
              "surface-tint": "#5e6756",
              "surface-dim": "#e4e3da",
              "on-surface": "#383833",
              "tertiary-fixed": "#f7c5c5",
              "inverse-on-surface": "#9e9d98",
              "on-tertiary-fixed": "#4b2b2c",
              "on-primary": "#ffffff",
              tertiary: "#815a5b",
              "inverse-surface": "#0e0e0c",
              "primary-container": "#dde6d1",
              "surface-variant": "#eae8e0",
              "surface-container": "#f6f3ed",
              "primary-fixed": "#dde6d1",
              outline: "#81817a",
              "surface-bright": "#fffcf7",
            },
            fontFamily: {
              headline: ["Plus Jakarta Sans"],
              body: ["Be Vietnam Pro"],
              label: ["Be Vietnam Pro"],
              display: "Plus Jakarta Sans",
            },
            animation: {
              float: "float 3s ease-in-out infinite",
            },
            keyframes: {
              float: {

    <!-- Iconify CDN -->
    <script src="https://code.iconify.design/iconify-icon/1.1.1/iconify-icon.min.js"></script>
    <!-- D3.js 库 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <link rel="stylesheet" href="Milvus/style.css?v=1787413746417" />

    <!-- IndexedDB 存储模块 -->
    <script src="Milvus/db.js?v=1787318203522"></script>
  </head>
  <body>
    <div id="root"></div>
    <input
      type="file"
      id="global-file-input"
      accept="image/*"
      style="display: none"
    />

    <script src="Milvus/app.min.js?v=1787413746417"></script>

    <!-- PWA Service Worker 注册 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => {
              console.log('[PWA] Service Worker 注册成功，Scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('[PWA] Service Worker 注册失败:', error);
            });
        });
      }
    </script>
  </body>
</html>
